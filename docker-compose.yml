name: pojian-voice

services:
  api:
    build: .
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      ENV: prod
      SECRET_KEY: "${SECRET_KEY:?please set SECRET_KEY in .env}"
      DATABASE_URL: "mysql+aiomysql://${MYSQL_USER:-pojian}:${MYSQL_PASSWORD:?please set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-pojian}?charset=utf8mb4"
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-memory}
      MILVUS_URI: http://milvus:19530
      AUTO_CREATE_TABLES: "true"
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pojian}
      MYSQL_USER: ${MYSQL_USER:-pojian}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?please set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?please set MYSQL_ROOT_PASSWORD in .env}"
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ---------- 可选：生产级向量库 ----------
  # docker compose --profile vector up -d
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    profiles: ["vector"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    profiles: ["vector"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.13
    profiles: ["vector"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
