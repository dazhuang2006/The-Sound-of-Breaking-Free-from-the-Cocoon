[project]
name = "pojian-voice"
version = "0.1.0"
description = "破茧之声：自闭症儿童居家康复与医疗随访 AI 智能助手"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
"app/api/*.py" = ["B008"]
"app/api/v1/*.py" = ["B008"]
